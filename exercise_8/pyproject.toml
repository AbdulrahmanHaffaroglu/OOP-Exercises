[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-system"
version = "0.1.0"
description = "Exercise project for a notification system with email, SMS, and push channels"
requires-python = ">=3.10"
authors = [
  { name = "Your Name" }
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
