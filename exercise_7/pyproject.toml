[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-reservation-system"
version = "0.1.0"
description = "An object-oriented hotel reservation system exercise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
hotel-reservation-demo = "hotel_reservation_system.main:run_scenario"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
